# Render Blueprint: the API. The frontend is a separate deploy (see README).
services:
  - type: web
    name: copeemachine-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY            # signs login sessions; generated once and kept across deploys
        generateValue: true
      - key: COOKIE_SAMESITE       # "None" while the frontend is on a different *.onrender.com host
        value: None
      - key: CORS_ORIGINS          # the frontend's https origin; fill in after the frontend is deployed
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: copeemachine
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
